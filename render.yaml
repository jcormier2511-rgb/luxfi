services:
  - type: web
    name: fi-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fi-postgres
          property: connectionString
      - key: ENABLE_WTB_SYNC
        value: "false"
      - key: FS_SYNC_INTERVAL_MS
        value: "90000"
      - key: MONITOR_EXTENSION_REMINDER_DAYS
        value: "3"
      # Admin routes (status, entitlement override) are unreachable until this
      # is set -- Render generates a random value on first deploy; view/rotate
      # it under the service's Environment tab.
      - key: ADMIN_API_TOKEN
        generateValue: true
      # WatchFacts FS/WTB inventory sync stays in its safe "not configured"
      # state (spec section 13) until real credentials are filled in here.
      - key: WATCHFACTS_API_BASE_URL
        value: ""
      - key: WATCHFACTS_API_USERNAME
        value: ""
      - key: WATCHFACTS_API_PASSWORD
        value: ""
      # WhatsApp Cloud API: messaging stays on the stub adapter, and the
      # webhook stays fail-closed (503), until these are filled in with real
      # values from the Meta App dashboard. WHATSAPP_WEBHOOK_VERIFY_TOKEN is
      # generated here; re-enter that same value when registering the webhook
      # URL (https://<this-service>.onrender.com/webhook/whatsapp) with Meta.
      - key: WHATSAPP_ACCESS_TOKEN
        value: ""
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: ""
      - key: WHATSAPP_APP_SECRET
        value: ""
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_GRAPH_API_VERSION
        value: v20.0

databases:
  - name: fi-postgres
    plan: starter
    databaseName: fi_production
    user: fi_app
