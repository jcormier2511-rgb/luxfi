name: Validate WhatsApp agent

on:
  pull_request:
    paths:
      - "whatsapp-agent/**"
      - ".github/workflows/whatsapp-agent-validation.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luxfi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d luxfi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/luxfi_test
    defaults:
      run:
        working-directory: whatsapp-agent
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: whatsapp-agent/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run full test suite
        run: npm test
      - name: Run production build
        run: npm run build
